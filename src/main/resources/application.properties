# Spring Boot Application Configuration
# ModResorts - Uber Cab Booking Integration

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/modresorts}
spring.datasource.username=${DATABASE_USERNAME:modresorts}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Uber API Configuration
uber.api.base.url=${UBER_API_BASE_URL:https://api.uber.com}
uber.api.auth.url=${UBER_AUTH_URL:https://login.uber.com/oauth/v2/token}
uber.api.secret.name=${UBER_API_SECRET_NAME:uber-credentials}

# Circuit Breaker Configuration (Resilience4j)
resilience4j.circuitbreaker.instances.uber.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.uber.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.uber.sliding-window-size=10
resilience4j.circuitbreaker.instances.uber.minimum-number-of-calls=5

# Logging Configuration
logging.level.com.acme.modres=INFO
logging.level.com.acme.modres.service.UberApiService=FINE
logging.level.com.acme.modres.servlet.CabBookingServlet=FINE

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookingcomp
  namespace: bookingcomp
  labels:
    app: bookingcomp
    version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookingcomp
  template:
    metadata:
      labels:
        app: bookingcomp
        version: "2.0.0"
    spec:
      containers:
        - name: bookingcomp
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9080
              protocol: TCP
          env:
            # Redis / Amazon ElastiCache
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            # Weather microservice (optional)
            - name: WEATHER_SERVICE_URL
              value: "{{WEATHER_SERVICE_URL}}"
            - name: WEATHER_API_KEY
              value: "{{WEATHER_API_KEY}}"
            # JVM tuning
            - name: JVM_ARGS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
            - name: TZ
              value: "UTC"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 30

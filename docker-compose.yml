version: "3.8"

services:
  modresorts:
    image: modresorts:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modresorts-app
    ports:
      - "8080:8080"
    environment:
      - TZ=UTC
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - SERVER_DISPLAY_NAME=${SERVER_DISPLAY_NAME:-modresorts-server}
      - SERVER_FULL_NAME=${SERVER_FULL_NAME:-modresorts-server-full}
      - JNDI_FACTORY=${JNDI_FACTORY:-com.sun.jndi.fscontext.RefFSContextFactory}
      - JNDI_PROVIDER_URL=${JNDI_PROVIDER_URL:-}
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/resorts/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge

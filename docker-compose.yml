version: "3.9"

services:
  bookingcomp:
    image: bookingcomp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookingcomp
    ports:
      - "8080:8080"
    environment:
      # JVM settings
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      TZ: "UTC"
      # Redis / ElastiCache connection (externalized singleton state)
      REDIS_HOST: "${REDIS_HOST:-localhost}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      # Weather Underground API key
      WEATHER_API_KEY: "${WEATHER_API_KEY:-}"
      # Remote service discovery URL (Kubernetes DNS-based)
      REMOTE_SERVICE_URL: "${REMOTE_SERVICE_URL:-}"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

version: "3.8"

services:
  bookingservices:
    image: bookingservices:latest
    container_name: bookingservices
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=UTC
      - TZ=UTC
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - SERVER_DISPLAY_NAME=${SERVER_DISPLAY_NAME:-bookingservices}
      - SERVER_FULL_NAME=${SERVER_FULL_NAME:-default-cell/default-node/bookingservices}
      - JNDI_PROVIDER_URL=${JNDI_PROVIDER_URL:-}
    volumes:
      - ./logs:/app/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/resorts/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  app-network:
    driver: bridge
